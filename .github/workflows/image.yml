# Docker image job (plans/test_plan.md §7 "image"): build + the four assertions on PRs
# touching the image inputs; publish to GHCR on pushes to main (:edge) and on v* tags
# (:X.Y.Z + :latest). Publishing needs only the workflow-scoped GITHUB_TOKEN.
name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "docker/**"
      - ".dockerignore"
      - "src/**"
      - "pyproject.toml"
      # the wheel build copies README.md (pyproject's `readme =` target), so a change to
      # its name or location breaks the image - as moving it to the root once did
      - "README.md"
      - ".github/workflows/image.yml"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: >
          docker build -f docker/Dockerfile -t euvd-watch:ci
          --build-arg SOURCE_URL="${{ github.server_url }}/${{ github.repository }}" .

      - name: "Assert 1: version exits 0"
        run: docker run --rm euvd-watch:ci version

      - name: "Assert 2: scan of a mounted fixture SBOM works"
        run: docker run --rm -v "$PWD/examples/sboms:/sboms:ro" euvd-watch:ci scan /sboms/demo.cdx.json

      - name: "Assert 3: runs as non-root"
        run: |
          uid="$(docker run --rm --entrypoint id euvd-watch:ci -u)"
          echo "container uid: $uid"
          [ "$uid" != "0" ]

      - name: "Assert 4: image size < 200 MB"
        run: |
          size="$(docker image inspect euvd-watch:ci --format '{{.Size}}')"
          echo "image size: $size bytes"
          [ "$size" -lt 209715200 ]

      - name: "Assert 5: image ships the [web] extra (dashboard deployable)"
        # `web serve` must get PAST the extra-import check (to the password-hash check) -
        # proves fastapi/uvicorn are present. Guards the deploy story (docs/deploy.md).
        run: |
          out="$(docker run --rm euvd-watch:ci web serve /tmp/nope.json 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "password hash"

      - name: "Assert 6: a named volume is writable by the non-root user"
        # State/cache dirs are pre-created euvd-owned so a persisted named volume inherits
        # that ownership - otherwise the volume mounts root-owned and every write EACCESs.
        run: docker run --rm -v euvd-ci-voltest:/home/euvd/.local/share/euvd-watch euvd-watch:ci db migrate

      - name: Publish to GHCR
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          owner="${{ github.repository_owner }}"
          image="ghcr.io/${owner,,}/euvd-watch"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            docker tag euvd-watch:ci "$image:$version"
            docker tag euvd-watch:ci "$image:latest"
          else
            docker tag euvd-watch:ci "$image:edge"
          fi
          docker push --all-tags "$image"
