name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest

  # Self-consumption of the composite action (test_plan.md §7 "dogfood", 5.3): the action
  # matches the demo SBOM against a cache primed from a committed fixture — no network —
  # and the matrix proves each fail-on value produces its contracted exit code.
  dogfood:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fail-on: none
            expect: "0"
          - fail-on: any
            expect: "1"
          - fail-on: exploited
            expect: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prime the HTTP cache from the committed fixture (no network in CI)
        run: |
          pip install --quiet .
          python scripts/prime_cache.py
      - name: Dogfood the action
        id: euvd
        continue-on-error: true
        uses: ./
        with:
          sbom-path: examples/sboms/demo.cdx.json
          fail-on: ${{ matrix.fail-on }}
          extra-args: "--exploited-only --no-enrich"
          version: source
          artifact-name: dogfood-findings-${{ matrix.fail-on }}
      - name: Assert exit code and findings
        env:
          EXPECT: ${{ matrix.expect }}
          GOT: ${{ steps.euvd.outputs.exit-code }}
          OUTCOME: ${{ steps.euvd.outcome }}
        run: |
          [ "$GOT" = "$EXPECT" ] || { echo "expected exit $EXPECT, got '$GOT'"; exit 1; }
          if [ "$EXPECT" = "0" ]; then
            [ "$OUTCOME" = "success" ]
          else
            [ "$OUTCOME" = "failure" ]
          fi
          python - <<'EOF'
          import json
          findings = json.load(open("euvd-findings.json"))["findings"]
          assert len(findings) == 1, findings
          assert findings[0]["record"]["euvd_id"] == "EUVD-DOGFOOD-0001", findings
          print("dogfood finding OK:", findings[0]["record"]["euvd_id"])
          EOF

  # X.3 hygiene (test_plan.md §7 "security"): dependency advisories. The SPDX-header
  # sweep lives in pytest (tests/unit/test_spdx_headers.py) and runs in the test job.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -e . pip-audit
      - run: pip-audit

  # X.3 dogfood: Syft generates THIS repo's SBOM and euvd-watch matches it, gated on
  # exploited findings — against the committed real exploited-catalog fixture (network-free).
  self-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate this repo's SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: self-sbom.cdx.json
      - name: Prime the HTTP cache with the real exploited-catalog fixture
        run: |
          pip install --quiet .
          python scripts/prime_cache.py tests/fixtures/euvd/search-exploited-page0.json
      - name: Match our own SBOM (gate on exploited)
        uses: ./
        with:
          sbom-path: self-sbom.cdx.json
          fail-on: exploited
          extra-args: "--exploited-only --no-enrich"
          version: source
          artifact-name: self-sbom-findings

  # X.2: the demo script is a product promise; it must keep running end-to-end (offline).
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet .
      - run: ./examples/demo.sh

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
