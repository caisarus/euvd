cache_dir: ~/.cache/euvd-watch
# Durable records (CRA events, audit log) - safe from cache wipes; back this up.
state_dir: ~/.local/share/euvd-watch
epss_threshold: 0.5
min_confidence: medium
# Tier-2 matching sends SBOM-derived product names to the EUVD API as search terms.
# Set false for confidential inventories (coverage drops to the exploited catalog only).
tier2_product_search: true
organization:
  name: "Example S.R.L."
  contact_email: security@example.com
  product_name: "Example Product"
cra_trigger:
  euvd_exploited: true
  cisa_kev: true
  epss_over_threshold: true
  min_confidence: medium
  require_all: false
# Defaults shown; override only if CRA guidance changes (see docs/cra.md).
cra_stages:
  - name: early_warning
    hours: 24
    anchor: first_seen
  - name: vulnerability_notification
    hours: 72
    anchor: first_seen
  - name: final_report
    hours: 336
    anchor: remediation_available
