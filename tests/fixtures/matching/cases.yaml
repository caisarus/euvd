# Matcher truth table (implementation_plan.md Step 2.3).
# THE regression suite for all future matcher changes: every bug found in the wild becomes
# a new row here BEFORE its fix is merged (test_plan.md principle 4).
#
# Each case: a component (run through normalize_component by the driver), one EUVD record's
# affected-product entries, and the expected outcome. `expect.matched: false` means no
# finding at all for that record.

- id: high-structured-hyphen-range
  component: {name: openssl, version: "3.0.2", cpe: "cpe:2.3:a:openssl:openssl:3.0.2:*:*:*:*:*:*:*", purl: "pkg:generic/openssl@3.0.2"}
  affected: [{vendor: openssl, product: openssl, version_range: "1.0.0-3.0.7"}]
  expect: {matched: true, confidence: high, strategy: structured}

- id: high-structured-lt-bound
  component: {name: openssl, version: "3.0.2", cpe: "cpe:2.3:a:openssl:openssl:3.0.2:*:*:*:*:*:*:*", purl: "pkg:generic/openssl@3.0.2"}
  affected: [{vendor: openssl, product: openssl, version_range: "<3.0.8"}]
  expect: {matched: true, confidence: high, strategy: structured}

- id: high-structured-compound-range
  component: {name: widget, version: "1.5.0", cpe: "cpe:2.3:a:acme:widget:1.5.0:*:*:*:*:*:*:*", purl: "pkg:generic/widget@1.5.0"}
  affected: [{vendor: acme, product: widget, version_range: ">=1.0 <2.0"}]
  expect: {matched: true, confidence: high, strategy: structured}

- id: boundary-low-edge-inclusive
  component: {name: widget, version: "1.0.0", cpe: "cpe:2.3:a:acme:widget:1.0.0:*:*:*:*:*:*:*", purl: "pkg:generic/widget@1.0.0"}
  affected: [{vendor: acme, product: widget, version_range: "1.0.0-2.0.0"}]
  expect: {matched: true, confidence: high, strategy: structured}

- id: boundary-high-edge-inclusive
  component: {name: widget, version: "2.0.0", cpe: "cpe:2.3:a:acme:widget:2.0.0:*:*:*:*:*:*:*", purl: "pkg:generic/widget@2.0.0"}
  affected: [{vendor: acme, product: widget, version_range: "1.0.0-2.0.0"}]
  expect: {matched: true, confidence: high, strategy: structured}

- id: boundary-just-outside-high-edge
  component: {name: widget, version: "2.0.1", cpe: "cpe:2.3:a:acme:widget:2.0.1:*:*:*:*:*:*:*", purl: "pkg:generic/widget@2.0.1"}
  affected: [{vendor: acme, product: widget, version_range: "1.0.0-2.0.0"}]
